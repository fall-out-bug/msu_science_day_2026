argin-top:15px;font-size:13px}.reading strong{display:block;color:var(--accent);font-size:12px;margin-bottom:4px}.view-a{background:radial-gradient(ellipse at 13% 0,#203e4f88,transparent 60%),#080f1b}.a-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px}.sector-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sector{padding:0;text-align:left;overflow:hidden;border-radius:12px;position:relative}.sector .sky{border:none;aspect-ratio:1.45}.sector-info{padding:12px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.sector-info small{display:block;font:10px ui-monospace,monospace}.sector.marked:before{content:'✓ В списке';position:absolute;right:8px;top:8px;z-index:3;font:10px system-ui;background:#c0ee85;color:#122115;padding:5px 8px;border-radius:16px}.sector.active{outline:1px solid var(--accent);box-shadow:none}.sector-focus{border:1px solid var(--line);padding:20px;border-radius:14px;background:#101d2ddd}.sector-focus .sky{aspect-ratio:1;margin-top:16px;border-radius:6px}.a-footer{margin-top:22px;padding:18px 0;border-top:1px solid var(--line)}.ranking{font-size:12px;display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.ranking button{padding:7px 10px}.view-b{--bg:#eee9de;--ink:#292d32;--muted:#746d61;--line:#c7beae;--surface:#f8f4eb;--accent:#a83d30;background:radial-gradient(#7c67551a .7px,transparent .7px) 0 0/5px 5px,#eee9de;color:var(--ink)}.view-b .shell{max-width:1280px}.view-b h1{font-family:Georgia,serif;font-size:clamp(38px,5vw,70px);font-weight:400;letter-spacing:-.045em}.view-b button{border-radius:3px}.view-b button.primary{color:#fff}.view-b .badge{border-radius:0}.view-b .hero{align-items:center}.case-number{font:80px/.9 Georgia,serif;color:#b6ac9c;letter-spacing:-.08em}.b-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:36px}.evidence-sheet{background:#fbf8f0;padding:25px;box-shadow:0 8px 20px #55433116;transform:rotate(-.5deg);border:1px solid #dcd4c6}.evidence-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.evidence-sheet .sky{aspect-ratio:1;border:9px solid #252b31}.evidence-sheet .frame-tag{display:none}.evidence-sheet figcaption{font:11px ui-monospace,monospace;margin:9px 0 18px;color:#716857}.evidence-sheet figure{margin:0}.evidence-sheet .extra{max-width:220px;margin:15px auto 0}.evidence-sheet .extra .sky{border-color:#a83d30}.case-sidebar{padding-top:16px}.case-sidebar h2{font:30px Georgia,serif}.case-sidebar .decision-buttons{display:grid}.case-sidebar .decision-buttons button{text-align:left}.case-sidebar .reading{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:15px 0}.case-ledger{display:flex;gap:10px;margin-top:23px}.case-ledger span{width:28px;height:28px;border:1px solid #b9aea0;display:grid;place-items:center;font:12px ui-monospace,monospace}.case-ledger .current{background:#a83d30;color:white;border-color:#a83d30}.view-c{--accent:#79bcff;--muted:#9eaed0;--line:#354870;--surface:#192645;--ink:#f1f3ff;background:radial-gradient(ellipse at 80% 15%,#47347699,transparent 65%),#10182f}.view-c h1{text-transform:uppercase;font-weight:800;font-size:clamp(32px,4.6vw,66px)}.view-c button.primary{color:#101b31}.c-layout{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:22px}.queue{display:grid;gap:8px;align-content:start}.queue button{display:flex;align-items:center;gap:12px;text-align:left;padding:10px}.queue img{width:42px;height:42px;object-fit:cover;border-radius:6px}.queue strong{font-size:12px;display:block}.queue small{font-size:10px}.signal-station{background:#0b1328b8;padding:24px;border:1px solid var(--line);border-radius:22px}.signal-station .sky{max-width:410px;aspect-ratio:1.2;margin:20px auto 0;border-radius:14px}.signal-station .decision-buttons button{padding:16px 10px}.queue-number{font:12px ui-monospace,monospace;letter-spacing:.12em;color:var(--accent)}.mission{padding:20px;background:#24305077;border-radius:16px;border:1px solid var(--line);align-self:start}.mission h2{font-size:20px}.mission p{font-size:13px;color:var(--muted);margin-top:15px}.progress{height:5px;border-radius:5px;background:#354870;margin:18px 0;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}.result{max-width:950px;margin:45px auto}.result h1{max-width:800px}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}.result-card{padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.result-card h3{font-size:15px}.result-card p{font-size:13px;color:var(--muted);margin-top:10px}.result-card .evidence{display:flex;gap:8px;margin-top:12px}.result-card .evidence img{width:calc((100% - 16px)/3);border:1px solid var(--line)}dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:min(630px,95vw);padding:22px;max-height:95vh;overflow:auto}dialog::backdrop{background:#000b}dialog .sky{width:min(480px,100%);aspect-ratio:1;margin:18px auto}dialog button{margin-right:7px}footer{font-size:10px;color:var(--muted);margin-top:25px;border-top:1px solid var(--line);padding-top:12px}#announce{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:25;background:#e9f5dd;color:#172020;border-radius:25px;padding:8px 20px;font-size:12px;pointer-events:none}#announce:empty{display:none}@media(max-width:1050px){.a-layout{grid-template-columns:1fr 290px}.sector-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.c-layout{grid-template-columns:170px 1fr}.mission{grid-column:1/-1}.b-layout{grid-template-columns:1fr 250px}.shell{padding:20px 22px 130px}}@media(max-width:680px){.shell{padding:16px 16px 140px}.topline{gap:10px;align-items:start}.topline small{max-width:145px}.topline button{font-size:11px;padding:6px}.hero{display:block;margin:25px 0 18px}.hero p{margin-top:16px}.a-layout,.b-layout,.c-layout{display:flex;flex-direction:column}.sector-grid{grid-template-columns:repeat(2,minmax(0,1fr))} <main id="app"></main><nav id="switcher" class="switcher" aria-label="Выбор прототипа"></nav><div id="announce" role="status" aria-live="polite"></div><dialog id="zoom"></dialog><dialog id="algorithm-hint" aria-labelledby="hint-title"></dialog><dialog id="discovery-story" aria-labelledby="discovery-title"></dialog>

<script>
'use strict';
const cases=window.PROTOTYPE_CASES;
const variants={A:'Обсерватория',B:'Детективное бюро',C:'Диспетчерская'};
const titles={normal:'Шум, без изменения источника',mover:'Движущийся источник',variable:'Изменение яркости',artifact:'Однокадровый артефакт',weak_mid:'Слабое изменение'};
const names={sky:'Небесный объект',artifact:'Помеха',stable:'Убедительного изменения нет',uncertain:'Недостаточно данных',send:'Проверить',skip:'Отложить'};
let variant=new URLSearchParams(location.search).get('variant')||'A';if(!variants[variant])variant='A';
const fresh=()=>({focus:0,epoch:0,marks:new Set(),checks:new Set(),decisions:{},ai:false,end:false,cursor:0,queue:{},mode:'pair',pair:[0,1],split:50,log:[],logNumber:0,started:false,briefing:false,predictions:{},insights:new Set(),revising:null});
const states={A:fresh(),B:fresh(),C:fresh()};let s=states[variant];
const score=c=>c.score.toFixed(2).replace('.',',');
function photo(c,e,extra=''){return `<div class="sky ${extra}"><img src="${c.frames[e]}" alt="Учебный сектор ${c.name}, наблюдение ${e+1}"><span class="frame-tag">НАБЛЮДЕНИЕ 0${e+1}</span><span class="reticle"></span></div>`}
function tools(c){return `<div class="tools"><label>Наблюдения</label>${[0,1,...(s.checks.has(c.id)?[2]:[])].map(e=>`<button data-action="epoch" data-n="${e}" class="${s.epoch===e?'active':''}" aria-pressed="${s.epoch===e}">${e+1}${e===2?' · новое':''}</button>`).join('')}<button data-action="zoom" aria-label="Увеличить сектор ${c.name}">Увеличить</button></div>`}
function decisions(c){return `<div class="decision-buttons">${['sky','artifact','uncertain'].map(d=>`<button data-action="decision" data-id="${c.id}" data-value="${d}" class="${s.decisions[c.id]===d?'active':''}" aria-pressed="${s.decisions[c.id]===d}">${names[d]}</button>`).join('')}</div>`}
function aiReading(c){return `<div class="reading"><strong>Подсказка алгоритма · ${score(c)}</strong>Оценка необычности рассчитана заранее. Это не вероятность открытия и не ответ о природе объекта.</div>`}
function header(){return `<div class="topline"><span class="brand">НУЛЬ ПЛЮС / КОСМИЧЕСКОЕ БЮРО</span><small>ИГРАБЕЛЬНЫЙ ПРОТОТИП<br>Учебные синтетические данные</small><button data-action="reset">Начать заново</button></div>`}
function footer(){return `<footer>Шесть одинаковых учебных серий во всех вариантах. Названия секторов условные. Изображения и оценки из пробного генератора; не проверка качества научной модели. Стек основной игры не выбран.</footer>`}
function VariantB(){const c=cases[s.cursor];const proposed=!!s.decisions[c.id];return `<div class="hero"><div><div class="step">КОСМИЧЕСКОЕ ДЕТЕКТИВНОЕ АГЕНТСТВО</div><h1>У каждого света<br>есть своя история.</h1></div><span class="case-number">0${s.cursor+1}</span></div><div class="b-layout"><section><div class="evidence-sheet"><div class="row spread"><span class="eyebrow">Дело ${String(s.cursor+1).padStart(2,'0')} / сектор «${c.name}»</span><span class="badge">${s.checks.has(c.id)?'НОВАЯ УЛИКА':'НАБЛЮДЕНИЯ'}</span></div><div class="evidence-pair space">${[0,1].map(e=>`<figure>${photo(c,e)}<figcaption>0${e+1} / ${e?'Повторное наблюдение':'Первое наблюдение'}</figcaption></figure>`).join('')}</div><button data-action="zoom">Рассмотреть крупнее</button>${s.checks.has(c.id)?`<figure class="extra">${photo(c,2)}<figcaption>03 / Дополнительное наблюдение</figcaption></figure>`:''}</div><div class="case-ledger">${cases.map((p,i)=>`<span class="${i===s.cursor?'current':''}">${i<s.cursor?'✓':i+1}</span>`).join('')}</div></section><aside class="case-sidebar"><div class="eyebrow accent">Ваша гипотеза</div><h2 class="space">Что здесь<br>произошло?</h2><p class="caption space">Обсудите две фотографии. Выберите объяснение, а потом проверьте его новой уликой.</p>${decisions(c)}<button class="primary space" data-action="check" ${!proposed?'disabled':''}>${s.checks.has(c.id)?'Улика уже открыта':'Открыть новую улику'}</button>${s.checks.has(c.id)?`${aiReading(c)}<p class="status">Гипотезу можно изменить — это и есть исследование.</p><button data-action="next-case">${s.cursor===cases.length-1?'Подвести итоги':'Следующее дело'} →</button>`:'<p class="notice">Здесь не нужно спешить. Сначала версия, потом проверка.</p>'}</aside></div>`}
function VariantC(){const review=s.cursor>=cases.length;const c=cases[review?s.focus:s.cursor];const done=Object.keys(s.queue).length;return `<div class="hero"><div><div class="step">ЦЕНТР ПРИЁМА СИГНАЛОВ / СМЕНА 01</div><h1>${review?'Теперь —<br><span class="accent">проверка решений.</span>':'Небо не ждёт.<br><span class="accent">Куда посмотрим?</span>'}</h1></div><p>${review?'Сравните первичный отбор с алгоритмом. Вернитесь к сомнительным решениям и откройте дополнительный кадр.':'Каждый сигнал — маленькое решение. Отправьте на проверку, отложите или признайте, что данных мало. Без штрафа за паузу.'}</p></div><div class="c-layout"><aside class="queue">${cases.map((p,i)=>`<button data-action="queue-focus" data-n="${i}" ${!review?'disabled':''} class="${p.id===c.id?'active':''}"><img src="${p.frames[0]}" alt=""><span><strong>${p.name}</strong><small>${s.queue[p.id]?names[s.queue[p.id]]:'В очереди'}</small></span></button>`).join('')}</aside><section class="signal-station"><div class="row spread"><span class="queue-number">СИГНАЛ ${String(cases.indexOf(c)+1).padStart(2,'0')} / 06</span><span class="badge">${review?'РАЗБОР':'ПЕРВИЧНЫЙ ОТБОР'}</span></div>${photo(c,s.epoch===2&&!s.checks.has(c.id)?0:s.epoch)}${tools(c)}${review?`${aiReading(c)}<button data-action="check">Дополнительный кадр</button>${decisions(c)}`:`<div class="decision-buttons"><button data-action="triage" data-value="skip">Отложить</button><button class="primary" data-action="triage" data-value="send">На проверку</button><button data-action="triage" data-value="uncertain">Не знаю</button></div>`}</section><aside class="mission"><span class="eyebrow accent">Пульт смены</span><h2 class="space">${done} / 6<br>сигналов разобрано</h2><div class="progress"><i style="width:${done/6*100}%"></i></div><p>${review?'Высокий балл — повод смотреть внимательнее, не готовое объяснение.':'Алгоритм подключится после вашего отбора. Так он не подскажет вам ответ заранее.'}</p><p>Разрешено сомневаться.<br>Разрешено менять решение.</p>${review?'<button class="primary space" data-action="finish">Закрыть смену →</button>':''}</aside></div>`}
function results(){
 const touched=cases.filter(c=>s.checks.has(c.id));
 return `<section class="result"><div class="step">РАЗБОР СМЕНЫ / ${variants[variant]}</div><h1>Хорошая находка —<br><span class="accent">не конец истории.</span></h1><p class="space muted">Проверено дополнительным кадром: ${touched.length} из 6. Здесь нет победителя «человек или машина». Сравните свои решения с учебным ключом.</p><div class="result-grid">${cases.map(c=>{
  const answer=variant==='A'?(verdictLabels[s.decisions[c.id]]||'Версия не записана'):(names[s.decisions[c.id]]||names[s.queue[c.id]]||(s.marks.has(c.id)?'Подозрительный участок':'Не отмечен'));
  return `<article class="result-card"><div class="row spread"><h3>${c.name}</h3><span class="badge">${score(c)} · АЛГОРИТМ</span></div>${variant==='A'&&s.predictions[c.id]?`<p>Первое впечатление: ${observationLabels[s.predictions[c.id]]}</p>`:''}<p>Ваше решение: <strong>${answer}</strong></p><div class="evidence">${c.frames.map((src,i)=>`<img src="${src}" alt="${c.name}, наблюдение ${i+1}">`).join('')}</div><p><strong>${titles[c.type]||c.type}.</strong> ${c.explanation}</p></article>`;
 }).join('')}</div><div class="reading"><strong>Что оценить в прототипе</strong>Было ли понятно первое действие? Удалось ли пройти участок без объяснений ведущего? Где пришлось искать следующую кнопку? Научный вывод о реальном объекте эти учебные случаи не дают.</div><button class="primary space" data-action="reset">Попробовать ещё раз</button></section>`;
}
function PrototypeSwitcher(){const short={A:'Обзор',B:'Дело',C:'Поток'};return `<button data-action="variant-prev" aria-label="Предыдущий вариант">←</button><small>ПРОТОТИП</small>${Object.entries(variants).map(([k,v])=>`<button data-action="variant" data-value="${k}" class="${variant===k?'active':''}" aria-label="${k}: ${v}" aria-pressed="${variant===k}"><span class="switch-long">${k} · ${v}</span><span class="switch-short">${k} · ${short[k]}</span></button>`).join('')}<button data-action="variant-next" aria-label="Следующий вариант">→</button>`}
function render(){document.body.className='view-'+variant.toLowerCase();document.title=variants[variant]+' · прототип';document.querySelector('#app').innerHTML=`<div class="shell">${header()}${s.end?results():({A:VariantA,B:VariantB,C:VariantC}[variant])()}${footer()}</div>`;document.querySelector('#switcher').innerHTML=PrototypeSwitcher();startObservatory()}
function announce(text){document.querySelector('#announce').textContent=text;clearTimeout(announce.t);announce.t=setTimeout(()=>document.querySelector('#announce').textContent='',2200)}
function current(){return cases[variant==='B'?s.cursor:variant==='C'&&s.cursor<cases.length?s.cursor:s.focus]}
function setVariant(v){cancelSectorFlight();variant=v;s=states[v];const url=new URL(location.href);url.searchParams.set('variant',v);history.replaceState(null,'',url);document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());document.querySelector('#announce').textContent='';render();document.querySelector('#app').scrollTo(0,0)}
function cycle(d){const ks=Object.keys(variants);setVariant(ks[(ks.indexOf(variant)+d+3)%3])}
function showZoom(){const c=current();const e=s.epoch===2&&!s.checks.has(c.id)?0:s.epoch;const el=document.querySelector('#zoom');el.innerHTML=`<div class="row spread"><h2>${c.name}</h2><button data-action="close-zoom">Закрыть</button></div>${photo(c,e)}<div class="tools">${[0,1,...(s.checks.has(c.id)?[2]:[])].map(i=>`<button data-action="zoom-epoch" data-n="${i}" class="${e===i?'active':''}">Наблюдение ${i+1}</button>`).join('')}</div><p class="caption">Увеличение меняет только размер отображения.</p>`;if(!el.open)el.showModal()}
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;
 const action=b.dataset.action,n=Number(b.dataset.n);
 const previousFocus=s.focus;
 if(action==='variant'){setVariant(b.dataset.value);return}
 if(action==='variant-prev'||action==='variant-next'){cycle(action==='variant-prev'?-1:1);return}
 if(action==='zoom'){showZoom();return}
 if(action==='close-zoom'){document.querySelector('#zoom').close();return}
 if(action==='close-hint'){document.querySelector('#algorithm-hint').close();return}
 if(action==='discovery'){showDiscovery(b.dataset.id);return}
 if(action==='close-discovery'){document.querySelector('#discovery-story').close();return}
 if(action==='ai'){const c=current();if(!s.insights.has(c.id))recordObservation(c.name+': по желанию открыта подсказка алгоритма');s.insights.add(c.id);s.ai=true;render();showAlgorithmHint();return}
 if(action==='zoom-epoch'){s.epoch=n;render();showZoom();return}
 if(action==='reset'){states[variant]=fresh();s=states[variant]}
 if(action==='start-investigation'){s.started=true;s.briefing=false}
 if(action==='briefing')s.briefing=true;
 if(action==='first-answer'){const c=current();s.predictions[c.id]=b.dataset.value;if(b.dataset.value==='same')s.marks.delete(c.id);else s.marks.add(c.id);recordObservation(c.name+': первое впечатление — «'+observationLabels[b.dataset.value]+'»')}
 if(action==='revise'){s.revising=current().id;s.epoch=2;s.pair=[1,2];s.mode='pair'}
 if(action==='focus'||action==='queue-focus'){s.focus=n;s.epoch=variant==='A'&&s.checks.has(current().id)?2:0;if(variant==='A'){s.mode='pair';s.pair=s.checks.has(current().id)?[1,2]:[0,1];s.revising=null}}
 if(action==='epoch'){s.epoch=n;if(variant==='A')s.mode='single'}
 if(action==='instrument-mode')s.mode=b.dataset.value;
 if(action==='frame-pair')s.pair=b.dataset.value.split(',').map(Number);
 if(action==='next-sector'){let offset=1;while(offset<cases.length&&s.decisions[cases[(s.focus+offset)%cases.length].id])offset++;s.focus=(s.focus+offset)%cases.length;s.epoch=s.checks.has(current().id)?2:0;s.pair=s.checks.has(current().id)?[1,2]:[0,1];s.mode='pair';s.revising=null}
 if(action==='check'){const c=current();if(!s.checks.has(c.id)&&variant==='A')recordObservation(c.name+': получен третий снимок');s.checks.add(c.id);s.epoch=2;if(variant==='A'){s.mode='pair';s.pair=[1,2]}announce('Получен третий снимок: ещё одно наблюдение для проверки.')}
 if(action==='decision'){if(variant==='A'&&s.decisions[b.dataset.id]!==b.dataset.value)recordObservation(current().name+': версия «'+verdictLabels[b.dataset.value]+'»');s.decisions[b.dataset.id]=b.dataset.value;s.revising=null}
 if(action==='next-case'){if(s.cursor===cases.length-1)s.end=true;else{s.cursor++;s.epoch=0}}
 if(action==='triage'){s.queue[current().id]=b.dataset.value;s.cursor++;s.epoch=0;if(s.cursor===cases.length){s.ai=true;s.focus=0;announce('Отбор завершён. Теперь можно пересмотреть решения')}}
 if(action==='finish')s.end=true;
 render();
 if(['reset','next-case','finish','briefing'].includes(action))document.querySelector('#app').scrollTo(0,0);
 if(variant==='A'&&s.started&&!s.briefing&&!s.end){
  if(['start-investigation','focus','next-sector','check','revise'].includes(action)){
   document.querySelector('.flow-heading').focus({preventScroll:true});
   document.querySelector('.observation-deck').scrollIntoView({block:'start'});
  }else if(['first-answer','decision'].includes(action)){
   const next=document.querySelector('.flow-actions');next.focus({preventScroll:true});next.scrollIntoView({block:'nearest'});
  }
 }
 if(variant==='A'&&['focus','next-sector'].includes(action)&&previousFocus!==s.focus){
  const target=s.focus;
  await playSectorFlight({from:{name:cases[previousFocus].name,x:sectorPositions[previousFocus][0],y:sectorPositions[previousFocus][1]},to:{name:cases[target].name,x:sectorPositions[target][0],y:sectorPositions[target][1]}});
  if(variant==='A'&&s.focus===target&&!s.end&&!s.briefing)document.querySelector('.flow-heading')?.focus({preventScroll:true});
 }
});
document.addEventListener('keydown',ev=>{if(ev.target.closest('input,textarea,select,[contenteditable]')||document.querySelector('dialog[open]'))return;if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){ev.preventDefault();cycle(ev.key==='ArrowLeft'?-1:1)}});
window.addEventListener('popstate',()=>{const v=new URLSearchParams(location.search).get('variant');if(variants[v]){cancelSectorFlight();variant=v;s=states[v];render()}});
render();
</script></body></html>
