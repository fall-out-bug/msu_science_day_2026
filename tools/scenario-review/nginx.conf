limit_req_zone $binary_remote_addr zone=scenario_comments:1m rate=10r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Iterative local experiments should show the currently deployed files.
    add_header Cache-Control "no-store" always;
    location = /scenario-comments {
        limit_except GET POST { deny all; }
        limit_req zone=scenario_comments burst=15 nodelay;
        client_max_body_size 20k;
        proxy_pass http://comments:8090;
        proxy_set_header Host $http_host;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
