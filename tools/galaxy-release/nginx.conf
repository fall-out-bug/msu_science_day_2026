limit_req_zone $binary_remote_addr zone=scenario_comments:1m rate=10r/m;
# A constant per-site key limits event ingestion without retaining client IPs.
limit_req_zone $server_name zone=galaxy_telemetry:1m rate=20r/s;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css;
    gzip_proxied any;
    add_header Cache-Control "no-store" always;
    location = /scenario-comments {
        limit_except GET POST { deny all; }
        limit_req zone=scenario_comments burst=15 nodelay;
        client_max_body_size 20k;
        proxy_pass http://comments:8090;
        proxy_set_header Host $http_host;
    }
    location = /telemetry/v1/events {
        limit_except POST { deny all; }
        access_log off;
        error_log /dev/null crit;
        limit_req zone=galaxy_telemetry burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass http://telemetry:8091;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header User-Agent "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
    }
    location / { try_files $uri $uri/ =404; }
}
