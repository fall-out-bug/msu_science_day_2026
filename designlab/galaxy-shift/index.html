<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103b40">
  <title>Ночь открытий: приключение в обсерватории</title>
  <link rel="stylesheet" href="galaxy.css">
  <link rel="stylesheet" href="sky.css">
  <link rel="stylesheet" href="library.css">
  <link rel="stylesheet" href="nika.css">
  <link rel="stylesheet" href="companion.css">
  <link rel="stylesheet" href="quest-scene.css">
  <link rel="stylesheet" href="cnn-guide.css">
</head>
<body>
  <canvas id="world" aria-label="Обсерватория ночью"></canvas>
  <div id="loading" role="status">Открываем обсерваторию<span></span></div>
  <main id="game" class="game-shell"></main>
  <noscript>Для запуска игры включите JavaScript. Игра работает без сети.</noscript>
  <script>
  (function () {
    function fail(message) {
      if (document.body.dataset.coreResourceFailure) return;
      document.body.dataset.coreResourceFailure = 'true';
      document.querySelector('#loading')?.remove();
      const root = document.querySelector('#game');
      if (!root) return;
      document.querySelectorAll('.modal,.nika-dialogue,.sky-atlas').forEach(node => node.remove());
      root.inert = false;
      root.innerHTML = '<section class="workbench"><section class="station resource-failure"><h1 tabindex="-1">Не удалось открыть игру</h1><p>Не загрузилась основная часть материалов. Повтори загрузку; если игра открыта из ZIP, распакуй архив целиком.</p><div class="navigation"><button class="primary" data-core-retry>Повторить загрузку</button></div></section></section>';
      if (typeof message === 'string') root.querySelector('p').textContent = message;
      root.querySelector('[data-core-retry]').addEventListener('click', () => location.reload());
      root.querySelector('h1').focus();
    }
    globalThis.galaxyCoreFailure = fail;
    document.addEventListener('error', event => {
      const script = event.target;
      if (script?.tagName === 'SCRIPT' && !script.async) fail();
      if (script?.tagName === 'IMG' && /\/assets\/galaxies\//.test(script.src)) {
        fail('Не удалось загрузить научный снимок. Повтори загрузку; если игра открыта из ZIP, распакуй архив целиком.');
      }
    }, true);
  })();
  </script>
  <script src="version.js"></script>
  <script src="lesson-storage.js"></script>
  <script src="telemetry.js"></script>
  <script src="data.js"></script>
  <script src="archive-data.js"></script>
  <script src="discovery-data.js"></script>
  <script src="cnn-architectures.js"></script>
  <script src="cnn-results-loader.js"></script>
  <script src="cnn-experiments.js"></script>
  <script src="metrics.js"></script>
  <script src="cnn-session.js"></script>
  <script src="cnn-guide.js"></script>
  <script src="world.js"></script>
  <script src="astronomy.js"></script>
  <script src="sky-data.js"></script>
  <script src="sky.js"></script>
  <script src="nika-dialogue.js"></script>
  <script src="quest-scene.js"></script>
  <script src="game.js"></script>
</body>
</html>
