    <linearGradient id="obs-tube" x2="0" y2="1"><stop stop-color="#f0d6a8"/><stop offset=".27" stop-color="#dfb578"/><stop offset=".64" stop-color="#a87c4c"/><stop offset="1" stop-color="#68543e"/></linearGradient>
    <linearGradient id="obs-console" x2="0" y2="1"><stop stop-color="#65838b"/><stop offset="1" stop-color="#344e68"/></linearGradient>
    <linearGradient id="obs-coat" x2="1" y2="1"><stop stop-color="#499d9e"/><stop offset="1" stop-color="#1b596a"/></linearGradient>
