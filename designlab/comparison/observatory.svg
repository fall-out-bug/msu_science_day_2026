<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="obs-title obs-desc" class="observatory-illustration">
  <title id="obs-title">Ночная обсерватория и астроном Ника</title>
  <desc id="obs-desc">Открытый купол над горной долиной, большой телескоп и два исследовательских прибора. Ника в круглых очках приглашает к пульту. Это вымышленная игровая сцена, не снимок научных наблюдений.</desc>
