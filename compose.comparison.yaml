name: sd2026-comparison

services:
  web:
    image: sd2026-comparison:local
    build: ./designlab/comparison
    restart: unless-stopped
    ports:
      - "${SD2026_COMPARISON_BIND_IP:-192.168.50.12}:${SD2026_COMPARISON_PORT:-8081}:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
